<!doctype html><meta charset="utf-8"><title>supertonic</title>
<script type="importmap">{"imports":{"onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.mjs"}}</script>
<script type="module">
import * as ort from 'onnxruntime-web';
import { loadTextToSpeech, loadVoiceStyle } from './helper.js';
ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
const styles = {};
window.job = null;
window.init = () => { window.job = { state: 'loading' }; (async () => { try {
  const r = await loadTextToSpeech('assets/onnx', { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
  window.tts = r.textToSpeech; window.job = { state: 'ready', sr: window.tts.sampleRate }; } catch (e) { window.job = { state: 'error', err: String(e && e.stack || e) }; } })(); };
const wav16 = (x, SR) => { const b = new ArrayBuffer(44 + x.length * 2), v = new DataView(b), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + x.length * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, x.length * 2, true);
  for (let i = 0; i < x.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, x[i])) * 32767, true); return b; };
// items: [{name, text, voice, speed}] -> saves tmp/<dir>/<name>.wav
window.synth = (items, dir, steps = 8) => { window.job = { state: 'running', done: 0, out: [] }; (async () => { try {
  for (const it of items) { if (!styles[it.voice]) styles[it.voice] = await loadVoiceStyle(['assets/voice_styles/' + it.voice + '.json']);
    const { wav, duration } = await window.tts.call(it.text, 'ko', styles[it.voice], steps, it.speed, 0.15);
    const n = Math.min(wav.length, Math.floor(duration[0] * window.tts.sampleRate)), x = Float32Array.from(wav.slice(0, n));
    await fetch('/__save?path=' + encodeURIComponent(dir + '/' + it.name + '.wav'), { method: 'POST', body: wav16(x, window.tts.sampleRate) });
    window.job.out.push({ name: it.name, dur: +(n / window.tts.sampleRate).toFixed(3) }); window.job.done++; await new Promise(r => setTimeout(r, 5)); }
  window.job.state = 'done'; } catch (e) { window.job.state = 'error'; window.job.err = String(e && e.stack || e); } })(); };
window.__ready = true;
</script>
