{

  if (hl === 'TR') { g.fillStyle = YEL; g.fillRect(cx, y0, w / 2, h / 2); }
  box(x0, y0, w, h, { p, w: 6, r: 6 });
  line(cx, y0, cx, y0 + h, { p, w: 6, seg: 50 }); line(x0, cy, x0 + w, cy, { p, w: 6, seg: 50 });
  if (hdr && p >= 1) {
    tx('급함', x0 + w / 4, y0 - hdrSize * 0.75, { size: hdrSize }); tx('안 급함', x0 + w * 3 / 4, y0 - hdrSize * 0.75, { size: hdrSize });
    tx('중요함', x0 - 22, y0 + h / 4, { size: hdrSize, align: 'right' }); tx('안 중요함', x0 - 22, y0 + h * 3 / 4, { size: hdrSize, align: 'right' });
  }
  if (cells && p >= 1) {
    const pos = { TL: [x0 + w / 4, y0 + h / 4], TR: [x0 + w * 3 / 4, y0 + h / 4], BL: [x0 + w / 4, y0 + h * 3 / 4], BR: [x0 + w * 3 / 4, y0 + h * 3 / 4] };
    for (const k in pos) tx(CELL_TXT[k], pos[k][0], pos[k][1], { size, maxW: w / 2 - 30, col: k === 'BR' ? '#777' : INK });
  }
}
/** 하루 칸 나누기 표 */
function dayTable(x, y, w, h, { rows, p = 1, lab = 150, size = 46, head = null } = {}) {
  const top = head ? y + 90 : y, rh = (y + h - top) / rows.length;
  if (p >= 1) { g.fillStyle = PAPER; g.fillRect(x, y, w, h); }
  box(x, y, w, h, { p, w: 6, r: 8 });
  if (head) { if (p >= 1) { g.fillStyle = YEL; g.fillRect(x + 3, y + 3, w - 6, 87); } line(x, top, x + w, top, { p, w: 5, seg: 50 }); if (p >= 1) tx(head, x + w / 2, y + 47, { size: 58 }); }
  line(x + lab, top, x + lab, y + h, { p, w: 5, seg: 50 });
  for (let i = 1; i < rows.length; i++) line(x, top + i * rh, x + w, top + i * rh, { p, w: 3.5, seg: 50, dash: null });
  if (p >= 1) rows.forEach((r, i) => tx(r, x + lab / 2, top + (i + 0.5) * rh, { size, maxW: lab - 16 }));
  return (i) => ({ x: x + lab + 14, y: top + i * rh + 10, w: w - lab - 28, h: rh - 20, cx: x + lab + (w - lab) / 2, cy: top + (i + 0.5) * rh });
}
function block(r, text, fill = LORA, size = 48) { box(r.x, r.y, r.w, r.h, { fill, r: 10, w: 4.5 }); tx(text, r.cx, r.cy, { size, maxW: r.w - 20 }); }
/** 만약 / 그러면 카드 */
function ifCard(cx, cy, w, h, head, body, fill) {
  box(cx - w / 2, cy - h / 2, w, h, { fill: PAPER, r: 16, w: 5.5 });
  g.fillStyle = fill; g.fillRect(cx - w / 2 + 4, cy - h / 2 + 4, w - 8, h * 0.32);
  line(cx - w / 2, cy - h / 2 + h * 0.32 + 4, cx + w / 2, cy - h / 2 + h * 0.32 + 4, { w: 5, seg: 60 });
  tx(head, cx, cy - h / 2 + h * 0.18, { size: h * 0.17 });
  tx(body, cx, cy + h * 0.17, { size: h * 0.15, maxW: w - 40 });
}

SCENES.sort((a, b) => a.n - b.n);
// T: 장면 키 → { 등장 이름: 시각 }
const T = Object.fromEntries(SCENES.map((s) => [s.key, s.T]));

// ───────── 효과음 큐: 같은 T에서 만든다 ─────────
const SFX_FILE = { pop: 'assets/sfx/pop.wav', whoosh: 'assets/sfx/whoosh.wav', ding: 'assets/sfx/ding.wav', pencil: 'assets/sfx/pencil.wav' };
const SFX_VOL = { pop: 0.6, whoosh: 0.45, ding: 0.7, pencil: 0.4 };
const SFX_LEAD = { whoosh: -0.1 };   // whoosh는 가장 큰 지점(약 0.13s)을 컷에 맞춘다
const SFX = [];
for (const s of SCENES) for (const [kind, key, off = 0, vol = SFX_VOL[kind]] of s.sfx) {
  SFX.push({ file: SFX_FILE[kind], t: +Math.max(0, s.T[key] + off + (SFX_LEAD[kind] || 0)).toFixed(3), vol, kind, scene: s.key });
}
SFX.sort((a, b) => a.t - b.t);

// 점검: 카드 표시가 script.json과 같은지, ding/whoosh 간격, 문장당 큐 수
{
  const want = SCRIPT.filter((l) => l.card).map((l) => +l.id.slice(1)).join(','), got = SCENES.filter((s) => s.card).map((s) => s.n).join(',');
  if (want !== got) console.warn('card mismatch', want, got);
  for (const a of SFX) if (a.kind === 'ding') for (const b of SFX) if (b.kind === 'whoosh' && Math.abs(a.t - b.t) < 0.1) console.warn('ding/whoosh overlap', a, b);
  CAPS.forEach((cp, i) => { const t1 = i + 1 < CAPS.length ? CAPS[i + 1].start - 0.15 : DUR; const n = SFX.filter((s) => s.t >= cp.start - 0.15 && s.t < t1).length; if (n > 3) console.warn('too many sfx', cp.id, n); });
}

// ───────── 렌더 ─────────
function drawCard(s) {
  const text = CAPS[s.n - 1].text, size = 100;
  let w = textW(text, size); const sc = Math.min(1, 1640 / w); w *= sc;
  const p = clamp((NOW - s.T.text) / 0.45), x0 = W / 2 - w / 2 - 20;
  if (p <= 0) return;
  g.save(); g.beginPath(); g.rect(0, 0, x0 + (w + 40) * p, H); g.clip();
  tx(text, W / 2, H * 0.5, { size: size * sc, col: '#232323' });
  g.restore();
}
function sceneAt(t) { let s = SCENES[0]; for (const x of SCENES) if (x.T.cut <= t) s = x; return s; }
function renderAt(t) {
  NOW = t; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.drawImage(BG, 0, 0);
  const s = sceneAt(t); SK = s.key;
  if (s.card) drawCard(s); else s.draw(s.T);
  if (window.PLACEHOLDER_TIMING) { tx('임시 타이밍 (timing.js 없음)', 30, 50, { size: 30, col: RED, align: 'left' }); }
}

// ───────── 프레임 시트 ─────────
window.sheet = async (times = CAPS.map((k) => (k.start + k.end) / 2), cols = 6, width = 270, savePath = null) => {
  const h = Math.round(width * H / W), rows = Math.ceil(times.length / cols);
  const sc = document.createElement('canvas'); sc.width = cols * width; sc.height = rows * (h + 28);
  const sg = sc.getContext('2d'); sg.fillStyle = '#222'; sg.fillRect(0, 0, sc.width, sc.height);
  times.forEach((tt, i) => {
    renderAt(tt); const x = (i % cols) * width, y = Math.floor(i / cols) * (h + 28);
    sg.drawImage(out, x, y, width, h); sg.fillStyle = '#ddd'; sg.font = '16px sans-serif';
    const cap = CAPS.find((k) => tt >= k.start && tt < k.end + 0.04);
    sg.fillText(`${tt.toFixed(2)}s ${cap ? cap.id : ''}`, x + 6, y + h + 20);
  });
  renderAt(+scrub.value);
  if (savePath) { const b = await new Promise((r) => sc.toBlob(r, 'image/png')); await fetch('/__save?path=' + encodeURIComponent(savePath), { method: 'POST', body: b }); }
  return sc.toDataURL('image/jpeg', 0.8);
};

// ───────── 내보내기 연결 (scripts/export.js) ─────────
